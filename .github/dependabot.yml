version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # The Railway image intentionally targets Python 3.11 while
      # torch==2.6.0+cpu is pinned. Runtime minor/major upgrades must be
      # deliberate migrations validated by the full container smoke suite.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
