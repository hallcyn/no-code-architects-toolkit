name: Monthly upstream check

on:
  schedule:
    # GitHub cron is UTC. 07:17 UTC stays on the first day in Europe/Paris
    # year-round and avoids the busiest top-of-hour scheduling window.
    - cron: "17 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-upstream-check
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check NCA Toolkit upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Detect upstream update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_upstream_update.py
