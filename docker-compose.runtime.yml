services:
  nca-toolkit:
    environment:
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_ACCESS_KEY: "minio-ci-access"
      S3_SECRET_KEY: "minio-ci-secret-change-me"
      S3_BUCKET_NAME: "nca-ci"
      S3_REGION: "us-east-1"
      S3_RETURN_PRESIGNED_URL: "true"
      S3_PRESIGNED_URL_EXPIRY: "3600"
      S3_ADDRESSING_STYLE: "path"
      S3_PUBLIC_ENDPOINT_URL: "http://127.0.0.1:9000"
      NCA_S3_COMPAT_MODE: "true"

  minio:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1"
    command: server /data
    environment:
      MINIO_ROOT_USER: "minio-ci-access"
      MINIO_ROOT_PASSWORD: "minio-ci-secret-change-me"
    ports:
      - "9000:9000"
